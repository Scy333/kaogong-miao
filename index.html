<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --pink:#FF69B4; --pink-d:#FF4FA3; --pink-l:#FFE3EE; --pink-ll:#FFF0F5;
  --txt:#8B4769; --txt-l:#C08; --card:rgba(255,255,255,.82);
}
body{
  font-family:"PingFang SC","微软雅黑","Hiragino Sans GB",sans-serif;
  background:linear-gradient(135deg,#FFE9F1 0%,#FFD6E4 45%,#FFC6D8 100%);
  color:var(--txt); min-height:100vh;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
/* ===== 左侧导航 ===== */
.sidebar{
  width:78px; flex-shrink:0; background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px); display:flex; flex-direction:column; align-items:center;
  padding:10px 0; gap:4px; overflow-y:auto; border-right:1px solid rgba(255,150,180,.25);
}
.sidebar .logo{ font-size:22px; margin-bottom:6px; }
.nav-item{
  width:62px; padding:8px 2px; border-radius:16px; text-align:center; cursor:pointer;
  color:var(--txt-l); transition:.2s; font-size:10px; line-height:1.2;
}
.nav-item svg{ width:24px; height:24px; display:block; margin:0 auto 3px; }
.nav-item span{ display:block; }
.nav-item.active{ background:var(--pink); color:#fff; box-shadow:0 4px 12px rgba(255,105,180,.45); }
.nav-item:active{ transform:scale(.94); }
.nav-item .badge{ position:relative; }
/* ===== 主区 ===== */
.main{ flex:1; overflow-y:auto; padding:12px; }
.topbar{
  background:var(--card); border-radius:20px; padding:14px 16px; margin-bottom:12px;
  box-shadow:0 4px 15px rgba(255,150,180,.2); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.topbar .clock{ font-size:22px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.topbar .date{ font-size:12px; color:var(--txt-l); }
.topbar .quote{ flex:1; min-width:160px; font-size:13px; font-style:italic; color:var(--txt); line-height:1.5; }
.checkin-btn{
  background:linear-gradient(135deg,#FF9EC4,#FF69B4); color:#fff; border:none; padding:9px 16px;
  border-radius:18px; font-size:13px; cursor:pointer; box-shadow:0 3px 10px rgba(255,105,180,.4); white-space:nowrap;
}
.checkin-btn:disabled{ background:#E0C0CC; box-shadow:none; cursor:default; }
/* ===== 卡片 ===== */
.card{ background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 4px 15px rgba(255,150,180,.15); }
.card h2{ font-size:17px; color:var(--pink); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.card h3{ font-size:14px; color:var(--pink-d); margin:14px 0 8px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ background:var(--pink); color:#fff; border:none; padding:8px 16px; border-radius:14px; font-size:13px; cursor:pointer; }
.btn.ghost{ background:var(--pink-l); color:var(--pink-d); }
.btn:active{ transform:scale(.96); }
input,textarea,select{ font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid #FFC0CB; border-radius:10px; background:#fff; color:var(--txt); width:100%; }
label{ font-size:12px; color:var(--txt-l); display:block; margin:8px 0 3px; }
/* 倒计时 */
.cd-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.cd-box{ background:var(--pink-ll); border-radius:16px; padding:14px; text-align:center; border:2px solid #FFD1DC; }
.cd-box .name{ font-size:13px; color:var(--txt-l); }
.cd-box .num{ font-size:34px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.cd-box .unit{ font-size:11px; color:var(--txt-l); }
/* 番茄钟 */
.pomo-wrap{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pomo-circle{ position:relative; width:140px; height:140px; flex-shrink:0; }
.pomo-circle svg{ transform:rotate(-90deg); }
.pomo-circle .t{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.pomo-circle .t .time{ font-size:26px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.pomo-circle .t .lab{ font-size:11px; color:var(--txt-l); }
/* 待办 */
.todo{ display:flex; align-items:center; gap:8px; background:#fff; border-radius:12px; padding:9px 10px; margin:6px 0; }
.todo input[type=checkbox]{ width:18px; height:18px; accent-color:var(--pink); flex-shrink:0; }
.todo.done span{ text-decoration:line-through; color:#bbb; }
.todo .del{ margin-left:auto; color:#E88; cursor:pointer; font-size:18px; }
/* 进度 */
.bar-bg{ height:18px; background:#FFD1DC; border-radius:10px; overflow:hidden; margin:6px 0; }
.bar-fill{ height:100%; background:linear-gradient(90deg,#FF9EC4,#FF69B4); border-radius:10px; transition:width .5s; }
.pct{ font-weight:bold; color:var(--pink); }
/* 公式 */
.formula{ background:var(--pink-ll); border-radius:12px; padding:10px; margin:6px 0; border-left:3px solid var(--pink); }
/* MCQ */
.mcq{ background:#fff; border-radius:14px; padding:14px; margin:10px 0; border:1px solid #FFD1DC; }
.mcq .q{ font-size:14px; margin-bottom:10px; line-height:1.6; }
.mcq .opt{ padding:9px 12px; background:var(--pink-ll); border-radius:10px; margin:6px 0; cursor:pointer; font-size:13px; transition:.15s; }
.mcq .opt:hover{ background:#FFE3EE; }
.mcq .opt.correct{ background:#C8F0D0; color:#1a7a3a; font-weight:bold; }
.mcq .opt.wrong{ background:#FFD3D3; color:#c33; }
.mcq .exp{ font-size:12px; color:var(--txt-l); margin-top:8px; line-height:1.6; display:none; }
/* 申论 */
.essay-quote{ background:linear-gradient(135deg,#FFF0F5,#FFE3EE); border-radius:14px; padding:14px; margin:8px 0; border-left:4px solid var(--pink); }
.essay-quote .q{ font-size:15px; line-height:1.7; color:var(--txt); font-style:italic; }
.essay-quote .t{ font-size:12px; color:var(--pink-d); margin-top:6px; }
.tab{ display:flex; gap:6px; margin-bottom:10px; }
.tab div{ padding:6px 14px; border-radius:12px; font-size:13px; background:var(--pink-l); color:var(--txt-l); cursor:pointer; }
.tab div.active{ background:var(--pink); color:#fff; }
/* 错题本 */
.mistake{ background:#fff; border-radius:14px; padding:12px; margin:8px 0; border:1px solid #FFD1DC; }
.mistake img{ max-width:100%; border-radius:10px; margin-top:8px; }
.mistake .meta{ font-size:11px; color:var(--txt-l); margin-top:6px; }
.tag{ display:inline-block; background:var(--pink); color:#fff; padding:2px 10px; border-radius:10px; font-size:11px; }
/* 统计 */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
.stat-box{ background:var(--pink-ll); border-radius:14px; padding:12px; text-align:center; }
.stat-box .n{ font-size:24px; font-weight:bold; color:var(--pink); }
.stat-box .l{ font-size:11px; color:var(--txt-l); }
/* 概览预览 */
.overview-mod{ display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:12px; padding:10px 12px; margin:5px 0; cursor:pointer; }
.overview-mod:active{ background:var(--pink-ll); }
.hidden{ display:none; }
.toast{ position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:50%; transform:translateX(-50%); background:var(--pink); color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; box-shadow:0 4px 15px rgba(255,105,180,.4); opacity:0; transition:.3s; z-index:999; pointer-events:none; }
.toast.show{ opacity:1; }
@media(max-width:420px){ .sidebar{ width:64px; } .nav-item{ width:54px; font-size:9px; } }

/* ===== iOS / 移动端优化 ===== */
input,textarea,select{ font-size:16px; }            /* 防止 iOS 输入框聚焦自动放大 */
body{ overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
.sidebar,.main{ -webkit-overflow-scrolling:touch; overscroll-behavior:none; }
.nav-item,.btn,.checkin-btn,.tab div,.overview-mod,.todo,.mcq .opt{ -webkit-touch-callout:none; }
* { -webkit-tap-highlight-color:transparent; }
@media (hover:hover){
  .mcq .opt:hover{ background:#FFE3EE; }
  .nav-item:hover{ background:rgba(255,105,180,.12); }
}
@media (max-width:430px){
  .sidebar{ width:72px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:env(safe-area-inset-bottom); }
  .nav-item{ width:62px; font-size:10px; padding:10px 2px; }
  .nav-item svg{ width:27px; height:27px; }
  .topbar{ padding:12px; gap:8px; }
  .topbar .clock{ font-size:19px; }
  .topbar .quote{ font-size:12px; }
  .checkin-btn{ padding:9px 12px; font-size:12px; }
  .main{ padding:10px; }
}
/* 安装引导横幅 */
.install-tip{ position:fixed; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(255,105,180,.97); color:#fff; border-radius:16px; padding:12px 14px;
  font-size:12.5px; line-height:1.55; box-shadow:0 6px 20px rgba(255,105,180,.5); z-index:998;
  display:none; align-items:center; gap:10px; }
.install-tip b{ font-weight:bold; }
.install-tip .x{ margin-left:auto; font-size:22px; line-height:1; cursor:pointer; opacity:.92; padding:0 4px; }

/* ===== 喵喵伙伴（与学习工作台合并） ===== */
.cat-area{ text-align:center; }
.cat-svg{ animation:breathe 2.5s ease-in-out infinite; }
.cat-svg img{ display:block; margin:0 auto; border-radius:20px; box-shadow:0 4px 15px rgba(255,105,180,.25); transition:transform .3s; }
.cat-svg.happy{ animation:shake .5s; }
@keyframes breathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes shake{0%,100%{transform:rotate(0);}25%{transform:rotate(-6deg);}75%{transform:rotate(6deg);}}
.cat-name{ font-size:18px; font-weight:bold; color:var(--pink); margin-top:4px; }
.cat-level{ display:inline-block; background:#FFB6C1; color:#fff; padding:2px 12px; border-radius:12px; font-size:12px; margin:4px 0; }
.bars{ margin:10px 0; }
.bar-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0; }
.bar-row span:first-child{ width:48px; text-align:right; color:var(--txt-l); }
.bar-bg{ flex:1; height:14px; background:#FFD1DC; border-radius:7px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:7px; transition:width .5s; }
.food{ background:linear-gradient(90deg,#FFB6C1,#FF69B4); }
.mood{ background:linear-gradient(90deg,#FFD700,#FFA500); }
.feed-btn{ background:linear-gradient(135deg,#FF9EC4,#FF69B4); color:#fff; border:none; padding:10px 24px; border-radius:20px; font-size:14px; cursor:pointer; margin-top:8px; box-shadow:0 3px 10px rgba(255,105,180,.4); -webkit-tap-highlight-color:transparent; }
.feed-btn:active{ transform:scale(.95); }
.feed-btn:disabled{ background:#E0C0CC; cursor:not-allowed; box-shadow:none; }
.fish{ position:fixed; opacity:0; font-size:28px; z-index:998; pointer-events:none; }
.tip-line{ font-size:12px; color:var(--txt-l); margin-top:8px; min-height:16px; }
.today-card{ background:#FFF0F5; border-radius:14px; padding:12px; margin-bottom:10px; }
.today-head{ display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:var(--pink); font-size:14px; margin-bottom:6px; }
.today-rate{ background:var(--pink); color:#fff; padding:1px 10px; border-radius:10px; font-size:13px; }
.today-theme{ font-size:12px; color:var(--txt-l); margin-bottom:8px; }
.today-task{ display:flex; align-items:flex-start; gap:8px; background:#fff; border-radius:10px; padding:9px 10px; margin:6px 0; cursor:pointer; font-size:13px; -webkit-tap-highlight-color:transparent; }
.today-task input{ margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:var(--pink); }
.today-task.done span{ text-decoration:line-through; color:#bbb; }
.today-tip{ font-size:12px; color:var(--txt-l); margin-top:8px; background:#fff; border-radius:8px; padding:6px 8px; }
.today-tip.ok{ color:var(--pink); font-weight:bold; }
.week-toggle{ text-align:center; font-size:13px; color:var(--pink); cursor:pointer; padding:8px; background:#FFE3EE; border-radius:12px; margin:6px 0; -webkit-tap-highlight-color:transparent; }
.week-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.wtab{ padding:4px 10px; border-radius:12px; font-size:12px; background:#FFE3EE; color:var(--txt-l); cursor:pointer; border:1px solid #FFC0CB; -webkit-tap-highlight-color:transparent; }
.wtab.active{ background:var(--pink); color:#fff; }
.week-theme{ font-size:13px; color:var(--txt-l); margin-bottom:10px; }
.day-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.day-col{ background:#FFF0F5; border-radius:10px; padding:5px 2px; text-align:center; font-size:10px; border:2px solid transparent; overflow:hidden; }
.day-col.today{ border-color:var(--pink); background:#FFE3EE; }
.day-col .dname{ font-weight:bold; color:var(--pink); margin-bottom:3px; }
.dtask{ background:#fff; border-radius:7px; padding:3px; margin:3px 0; display:flex; align-items:flex-start; gap:2px; cursor:pointer; text-align:left; }
.dtask input{ margin-top:1px; flex-shrink:0; width:11px; height:11px; accent-color:var(--pink); }
.dtask.done label{ text-decoration:line-through; color:#bbb; }
.dtask label{ line-height:1.25; cursor:pointer; font-size:9px; }
.progress-card{ margin-top:14px; }
.prog-bar-bg{ height:20px; background:#FFD1DC; border-radius:12px; overflow:hidden; margin:8px 0; }
.prog-bar-fill{ height:100%; background:linear-gradient(90deg,#FF9EC4,#FF69B4); border-radius:12px; transition:width .6s; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; color:#fff; font-size:12px; font-weight:bold; }
.prog-stats{ display:flex; gap:8px; }
.prog-stat{ flex:1; background:#FFF0F5; border-radius:12px; padding:8px; text-align:center; }
.prog-stat .n{ font-size:20px; font-weight:bold; color:var(--pink); }
.prog-stat .l{ font-size:10px; color:var(--txt-l); }
.weak-card{ background:#FFF0F5; border-radius:14px; padding:12px; margin-top:8px; border-left:4px solid var(--pink); }
.weak-tag{ display:inline-block; background:var(--pink); color:#fff; padding:1px 8px; border-radius:10px; font-size:11px; margin-bottom:6px; }

function defaultFormulas(){
  return {

}

function todayStudy(){ const d=todayKey(); if(!state.study[d])state.study[d]={}; return state.study[d]; }
function modStudy(m){ const ts=todayStudy(); if(!ts[m])ts[m]={todos:[],pomo:0,target:120}; return ts[m]; }

/* ============ 渲染导航 ============ */
function renderNav(){
  const nav=document.getElementById('sidebar');
  nav.innerHTML='<div class="logo">🐱</div>';
  MODULES.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='nav-item'+(i===0?' active':'');
    d.dataset.idx=i; d.dataset.mod=m;
    d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+MOD_ICONS[m]+'</svg><span>'+m+'</span>';
    d.onclick=()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); d.classList.add('active'); renderView(i); };
    nav.appendChild(d);
  });
}

/* ============ 顶部：时钟/打卡/鸡汤 ============ */
function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  const wd=['日','一','二','三','四','五','六'][n.getDay()];
  document.getElementById('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 周${wd}`;
}
function renderTop(){
  document.getElementById('quote').textContent='"'+QUOTES[dayIndex()%QUOTES.length]+'"';
  const btn=document.getElementById('checkinBtn');
  if(state.checkin[todayKey()]){ btn.disabled=true; btn.textContent='✓ 今日已打卡'; }
  else { btn.disabled=false; btn.textContent='✓ 今日打卡'; }
}
function doCheckin(){
  if(state.checkin[todayKey()]){ toast('今天已经打卡啦~'); return; }
  state.checkin[todayKey()]=true; save(); renderTop();
  toast('🎉 打卡成功！今天也要加油哦');
}

/* ============ 主视图路由 ============ */
function renderView(i){
  const v=document.getElementById('view');
  const m=MODULES[i];
  if(m==='倒计时')return v.innerHTML=viewCountdown();
  if(m==='言语理解')return v.innerHTML=viewStudy('言语理解',{idiom:true});
  if(m==='资料分析')return v.innerHTML=viewStudy('资料分析',{formula:true});
  if(m==='逻辑判断')return v.innerHTML=viewStudy('逻辑判断',{});
  if(m==='政治理论')return v.innerHTML=viewStudy('政治理论',{mcq:'政治理论',bank:POLITICS});
  if(m==='数量关系')return v.innerHTML=viewStudy('数量关系',{formula:true});
  if(m==='常识判断')return v.innerHTML=viewStudy('常识判断',{mcq:'常识判断',bank:COMMON});
  if(m==='申论')return v.innerHTML=viewEssay();
  if(m==='打卡日历')return v.innerHTML=viewCalendar();
  if(m==='错题本')return v.innerHTML=viewMistakes();
  if(m==='学习统计')return v.innerHTML=viewStats();
}

/* ===== 倒计时 ===== */
function viewCountdown(){
  // 今日概览预览（可点击每个部分跳转）
  let todayMin=0; const ts=todayStudy();
  for(const m of Object.keys(ts)) todayMin+=ts[m].pomo||0;
  const ov=`<div class="card"><h2>🏠 今日概览 · 点击模块预览</h2>
    <div class="stat-grid" style="margin-bottom:10px;">
      <div class="stat-box"><div class="n">${state.checkin[todayKey()]?'✓':'○'}</div><div class="l">今日打卡</div></div>
      <div class="stat-box"><div class="n">${todayMin}</div><div class="l">专注(分)</div></div>
      <div class="stat-box"><div class="n">${Object.keys(ts).length}</div><div class="l">学习模块</div></div>
    </div>
    <div id="ovMods"></div></div>`;
  let h=ov + homeCompanionHTML();
  h+='<div class="card"><h2>⏰ 考试倒计时</h2><div class="cd-grid">';
  const today=new Date(); today.setHours(0,0,0,0);
  for(const [name,date] of Object.entries(state.examDates)){
    const d=new Date(date+'T00:00:00'); const diff=Math.ceil((d-today)/86400000);
    h+=`<div class="cd-box"><div class="name">${name}</div><div class="num">${diff>0?diff:0}</div><div class="unit">天后 · ${date}</div></div>`;
  }
  h+='</div><h3>✏️ 修改考试日期</h3>';
  for(const name of Object.keys(state.examDates)){
    h+=`<label>${name}</label><input type="date" value="${state.examDates[name]}" onchange="setExam('${name}',this.value)">`;
  }
  h+='<p style="font-size:12px;color:var(--txt-l);margin-top:10px;">数据保存在本机，换设备需重新设置。</p></div>';
  setTimeout(renderOverviewMods,30);
  setTimeout(()=>{ renderHomeCat(); renderHomePlan(); renderHomeWeak(); },30);
  return h;
}
function renderOverviewMods(){
  const box=document.getElementById('ovMods'); if(!box)return;
  box.innerHTML=MODULES.slice(1,8).map((m,i)=>{
    const p=progressOf(m); const min=(modStudy(m).pomo)||0;
    return `<div class="overview-mod" onclick="jumpMod(${i+1})">
      <span>${MOD_ICONS[m]?'':''}📌 ${m}</span>
      <span><b class="pct">${p}%</b> · ${min}分 ›</span></div>`;
  }).join('');
}
function jumpMod(i){ document.querySelectorAll('.nav-item')[i].click(); }
function setExam(name,val){ state.examDates[name]=val; save(); renderView(0); toast('已更新 '+name); }

const pomoState={};
function pomoStart(mod){
  if(pomoState[mod]&&pomoState[mod].running)return;
  const ms=modStudy(mod);
  if(!pomoState[mod])pomoState[mod]={total:25*60,left:25*60,running:false};
  pomoState[mod].running=true;
  toast(mod+' 番茄钟开始，专注25分钟！');
  pomoState[mod].timer=setInterval(()=>{
    pomoState[mod].left--;
    const s=pomoState[mod]; const arc=document.getElementById('pomoArc_'+mod); const tm=document.getElementById('pomoTime_'+mod);
    if(arc){ const C=389; arc.setAttribute('stroke-dashoffset', C*(1-s.left/s.total)); }
    if(tm){ const m=Math.floor(s.left/60),sec=s.left%60; tm.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
    if(s.left<=0){ clearInterval(s.timer); s.running=false; ms.pomo+=25; save();
      const info=document.getElementById('pomoInfo_'+mod); if(info)info.innerHTML='今日已专注：<b class="pct">'+ms.pomo+'</b> 分钟';
      toast('🍅 '+mod+' 番茄钟完成！+25分钟'); pomoResetArc(mod); }
  },1000);
}
function pomoReset(mod){ if(pomoState[mod]&&pomoState[mod].timer)clearInterval(pomoState[mod].timer); pomoState[mod]={total:25*60,left:25*60,running:false}; pomoResetArc(mod); }
function pomoResetArc(mod){ const arc=document.getElementById('pomoArc_'+mod); const tm=document.getElementById('pomoTime_'+mod); if(arc)arc.setAttribute('stroke-dashoffset',389); if(tm)tm.textContent='25:00'; }

function addMistake(){
  const mod=document.getElementById('mistakeMod').value;
  const text=document.getElementById('mistakeText').value.trim();
  const file=document.getElementById('mistakeImg').files[0];
  if(!text&&!file){ toast('请填写内容或上传图片'); return; }
  const done=(imgData)=>{
    state.mistakes.unshift({mod,text,img:imgData,date:todayKey()}); save();
    document.getElementById('mistakeText').value=''; document.getElementById('mistakeImg').value='';
    renderMistakes(); toast('错题已保存 📕');
  };
  if(file){
    const r=new FileReader();
    r.onload=e=>{ // 压缩
      const img=new Image(); img.onload=()=>{
        const c=document.createElement('canvas'); const max=800; let w=img.width,h=img.height;
        if(w>max){ h=h*max/w; w=max; } c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        done(c.toDataURL('image/jpeg',0.7));
      }; img.src=e.target.result;
    }; r.readAsDataURL(file);
  } else done(null);
}
function renderMistakes(){
  const box=document.getElementById('mistakeList'); if(!box)return;
  if(!state.mistakes.length){ box.innerHTML='<div style="font-size:12px;color:#bbb;">还没有错题，做错的题记在这里吧~</div>'; return; }
  box.innerHTML=state.mistakes.map((m,i)=>`<div class="mistake"><span class="tag">${m.mod}</span><span style="float:right;font-size:11px;color:#bbb;">${m.date}</span><div style="margin-top:6px;font-size:13px;line-height:1.6;">${escapeHtml(m.text)}</div>${m.img?`<img src="${m.img}" alt="错题图">`:''}<span class="del" style="float:right;cursor:pointer;color:#E88;font-size:18px;" onclick="delMistake(${i})">×</span></div>`).join('');

/* ===== 工具 ===== */
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

const DAY_NAMES=['周一','周二','周三','周四','周五','周六','周日'];
function getWeekDay(){
  const now=new Date();
  const diff=Math.floor((now-PLAN_START)/86400000);
  let week=Math.floor(diff/7); if(week<0)week=0; if(week>15)week=15;
  let day=((diff%7)+7)%7;
  return {week,day,diff};
}
function getDayTasks(week,day){
  const w=WEEKS[week];
  if(day===5) return ['行测套题1套（限时120分钟）','错题精析+复盘'];
  if(day===6) return (week>=13)?['★全真模考：行测+申论','模考复盘总结']:['申论完整1套（含大作文）','对照范文修改'];
  const weak=WEAK_ROTATE[day];
  return [w.core,'弱点补强：'+weak,'申论金句背5句+例子1个'];
}

/* 小猫 */
function renderHomeCat(){
  const tk=todayKey();
  if(state.cat.day!==tk){ state.cat.day=tk; state.cat.food=0; state.cat.mood=0; save(); }
  const food=state.cat.food||0, m=state.cat.mood||0, grow=state.cat.grow||0;
  const bf=document.getElementById('homeBarFood'); if(bf)bf.style.width=food+'%';
  const bm=document.getElementById('homeBarMood'); if(bm)bm.style.width=m+'%';
  const lv=Math.floor(grow/10);
  const names=['奶猫','小猫','大猫','猫学长','猫科长','猫局长','猫司长','资深猫局长','上岸猫','公务员猫'];
  const cl=document.getElementById('homeCatLevel'); if(cl)cl.textContent='Lv.'+(lv+1)+' '+names[Math.min(lv,9)];
  const fed=state['fed_'+tk]==='1';
  showFace(fed?'happy':(food>=80?'normal':'hungry'));
  const tip=document.getElementById('homeCatTip');
  if(tip)tip.textContent = fed ? '团子吃得好满足~ 明天也要来打卡哦 💕' : (food>=80?'团子馋小鱼干啦，快去喂它~':'团子饿肚子了😿，先去完成今日任务吧！');
}
function showFace(type){
  ['eyesN','eyesH','eyesA'].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
  ['mouthN','mouthH','mouthA'].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
  const map={normal:['eyesN','mouthN'],happy:['eyesH','mouthH'],hungry:['eyesA','mouthA']};
  map[type].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='';});
}
function feedCat(){
  const tk=todayKey();
  if(state['fed_'+tk]==='1'){ toast('今天已经喂过团子啦，明天见~ 😊'); return; }
  const {week,day}=getWeekDay();
  const tTasks=getDayTasks(week,day); let tDone=0;
  tTasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+day+'-'+i]==='1') tDone++; });
  if(tDone/tTasks.length<0.8){ toast('先完成今日80%任务才能喂猫哦~'); return; }
  const fish=document.getElementById('homeFish');
  if(fish){ fish.style.cssText='position:fixed;right:24px;top:50%;font-size:28px;opacity:1;transition:all .8s;z-index:998;'; setTimeout(()=>{ fish.style.right='50%'; fish.style.top='40%'; },10); setTimeout(()=>{ fish.style.opacity='0'; },800); }
  state['fed_'+tk]='1'; state.cat.food=100; state.cat.mood=100; state.cat.grow=(state.cat.grow||0)+2; save();
  renderHomeCat();
  const catImg=document.getElementById('homeCatImg'); if(catImg){ catImg.style.transform='scale(1.2)'; setTimeout(()=>catImg.style.transform='',500); }
  const wrap=document.getElementById('homeCatSvg'); if(wrap){ wrap.classList.add('happy'); setTimeout(()=>wrap.classList.remove('happy'),500); }
  const tip=document.getElementById('homeCatTip'); if(tip)tip.textContent='团子吃得好开心！喵呜~ 明天也要来打卡哦 💕';
  toast('🐟 团子吃到了小鱼干，心情+100！');
  updatePlanProgress(week,day);
}
/* 16周计划 */
function renderHomePlan(){
  const {week,day}=getWeekDay();
  renderHomeToday(week,day);
  renderHomeWeekTabs(week);
  renderHomeWeek(week,day);
  updatePlanProgress(week,day);
}
function renderHomeToday(week,day){
  const w=WEEKS[week]; const tasks=getDayTasks(week,day);
  let done=0; tasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+day+'-'+i]==='1') done++; });
  const rate=tasks.length?Math.round(done/tasks.length*100):0;
  let html='<div class="today-head"><span>第'+(week+1)+'周 · '+DAY_NAMES[day]+'</span><span class="today-rate">'+rate+'%</span></div>';
  html+='<div class="today-theme">📌 '+w.theme+'</div>';
  tasks.forEach((task,i)=>{
    const checked=state['plan_'+week+'-'+day+'-'+i]==='1';
    html+='<label class="today-task'+(checked?' done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="togglePlanTask('+week+','+day+','+i+')"><span>'+task+'</span></label>';
  });
  if(done<tasks.length) html+='<div class="today-tip">还差 '+(tasks.length-done)+' 项完成，完成80%就能喂团子啦~ 🐟</div>';
  else html+='<div class="today-tip ok">今日任务全部完成！去喂团子吧 🐟</div>';
  const el=document.getElementById('homeTodayCard'); if(el)el.innerHTML=html;
}
function togglePlanTask(week,day,i){
  const k='plan_'+week+'-'+day+'-'+i;
  state[k]=state[k]==='1'?'0':'1'; save();
  const d=getWeekDay().day;
  renderHomeToday(week,d); renderHomeWeek(week,d); updatePlanProgress(week,d);
}
let homeWeek=null;
function renderHomeWeekTabs(week){
  const tabs=document.getElementById('homeWeekTabs'); if(!tabs)return;
  tabs.innerHTML='';
  for(let i=Math.max(0,week-1);i<=Math.min(15,week+1);i++){
    const t=document.createElement('div'); t.className='wtab'+(i===week?' active':'');
    t.textContent='第'+(i+1)+'周'; t.onclick=()=>{ homeWeek=i; renderHomeWeek(homeWeek,getWeekDay().day); };
    tabs.appendChild(t);
  }
}
function renderHomeWeek(week,todayDay){
  homeWeek=week;
  const w=WEEKS[week];
  const theme=document.getElementById('homeWeekTheme'); if(theme)theme.innerHTML='📌 第'+(week+1)+'周 · '+w.theme;
  const grid=document.getElementById('homeDayGrid'); if(!grid)return;
  grid.innerHTML='';
  for(let d=0;d<7;d++){
    const col=document.createElement('div'); col.className='day-col'+(d===todayDay?' today':'');
    const tasks=getDayTasks(week,d);
    let html='<div class="dname">'+(d===todayDay?'🔥':'')+DAY_NAMES[d]+'</div>';
    tasks.forEach((task,i)=>{
      const key=week+'-'+d+'-'+i; const done=state['plan_'+key]==='1';
      html+='<div class="dtask'+(done?' done':'')+'" onclick="togglePlanTask('+week+','+d+','+i+')"><input type="checkbox" '+(done?'checked':'')+' onclick="event.stopPropagation()"><label>'+task+'</label></div>';
    });
    col.innerHTML=html; grid.appendChild(col);
  }
  updatePlanProgress(week,todayDay);
}
function updatePlanProgress(week,todayDay){
  const tTasks=getDayTasks(week,todayDay); let tDone=0;
  tTasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+todayDay+'-'+i]==='1') tDone++; });
  const tRate=tTasks.length?Math.round(tDone/tTasks.length*100):0;
  const tb=document.getElementById('homeTodayBar'); if(tb){ tb.style.width=tRate+'%'; tb.textContent=tRate+'%'; }
  const st=document.getElementById('homeStatToday'); if(st)st.textContent=tDone+'/'+tTasks.length;
  let wTotal=0,wDone=0; for(let d=0;d<7;d++){ const dt=getDayTasks(week,d); wTotal+=dt.length; dt.forEach((_,i)=>{ if(state['plan_'+week+'-'+d+'-'+i]==='1') wDone++; }); }
  const wRate=Math.round(wDone/wTotal*100); const sw=document.getElementById('homeStatWeek'); if(sw)sw.textContent=wRate+'%';
  let allTotal=0,allDone=0; for(let wk=0;wk<16;wk++){ for(let d=0;d<7;d++){ const dt=getDayTasks(wk,d); allTotal+=dt.length; dt.forEach((_,i)=>{ if(state['plan_'+wk+'-'+d+'-'+i]==='1') allDone++; }); } }
  const aRate=Math.round(allDone/allTotal*100); const sa=document.getElementById('homeStatTotal'); if(sa)sa.textContent=aRate+'%';
  const fb=document.getElementById('homeFeedBtn'); if(fb) fb.disabled = tRate<80;
}
function toggleHomeWeek(){
  const p=document.getElementById('homeWeekPanel'); const t=document.querySelector('.week-toggle');
  if(p.style.display==='none'){ p.style.display='block'; t.innerHTML='📆 收起本周计划 ▴'; }
  else { p.style.display='none'; t.innerHTML='📆 查看本周计划 ▾'; }
}
/* 弱点补给站 */
let weakIdx=0;
function renderHomeWeak(){
  const cats=Object.keys(WEAK_KNOWLEDGE);
  const cat=cats[weakIdx%cats.length];
  const items=WEAK_KNOWLEDGE[cat];
  const item=items[Math.floor(weakIdx/4)%items.length];
  const el=document.getElementById('homeWeakCard');
  if(el)el.innerHTML='<span class="weak-tag">'+cat+'</span><div class="weak-title">📖 '+item.t+'</div><div class="weak-body">'+item.b+'</div>';
}
function refreshWeak(){ weakIdx++; renderHomeWeak(); toast('已切换弱点补给 📖'); }
