<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --pink:#FF69B4; --pink-d:#FF4FA3; --pink-l:#FFE3EE; --pink-ll:#FFF0F5;
  --txt:#8B4769; --txt-l:#C08; --card:rgba(255,255,255,.82);
}
body{
  font-family:"PingFang SC","微软雅黑","Hiragino Sans GB",sans-serif;
  background:linear-gradient(135deg,#FFF4F8 0%,#FFEAF1 45%,#FFE0EA 100%);
  color:var(--txt); min-height:100vh;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
/* ===== 左侧导航 ===== */
.sidebar{
  width:78px; flex-shrink:0; background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px); display:flex; flex-direction:column; align-items:center;
  padding:10px 0; gap:4px; overflow-y:auto; border-right:1px solid rgba(255,150,180,.25);
}
.sidebar .logo{ font-size:22px; margin-bottom:6px; }
.nav-item{
  width:62px; padding:8px 2px; border-radius:16px; text-align:center; cursor:pointer;
  color:var(--txt-l); transition:.2s; font-size:10px; line-height:1.2;
}
.nav-item svg{ width:24px; height:24px; display:block; margin:0 auto 3px; }
.nav-item span{ display:block; }
.nav-item.active{ background:var(--pink); color:#fff; box-shadow:0 4px 12px rgba(255,105,180,.45); }
.nav-item:active{ transform:scale(.94); }
.nav-item .badge{ position:relative; }
/* ===== 主区 ===== */
.main{ flex:1; overflow-y:auto; padding:12px; }
.topbar{
  background:var(--card); border-radius:20px; padding:14px 16px; margin-bottom:12px;
  box-shadow:0 4px 15px rgba(255,150,180,.2); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.topbar .clock{ font-size:22px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.topbar .date{ font-size:12px; color:var(--txt-l); }
.topbar .quote{ flex:1; min-width:160px; font-size:13px; font-style:italic; color:var(--txt); line-height:1.5; }
.checkin-btn{
  background:linear-gradient(135deg,#FF9EC4,#FF69B4); color:#fff; border:none; padding:9px 16px;
  border-radius:18px; font-size:13px; cursor:pointer; box-shadow:0 3px 10px rgba(255,105,180,.4); white-space:nowrap;
}
.checkin-btn:disabled{ background:#E0C0CC; box-shadow:none; cursor:default; }
/* ===== 卡片 ===== */
.card{ background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 4px 15px rgba(255,150,180,.15); }
.card h2{ font-size:17px; color:var(--pink); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.card h3{ font-size:14px; color:var(--pink-d); margin:14px 0 8px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ background:var(--pink); color:#fff; border:none; padding:8px 16px; border-radius:14px; font-size:13px; cursor:pointer; }
.btn.ghost{ background:var(--pink-l); color:var(--pink-d); }
.btn:active{ transform:scale(.96); }
input,textarea,select{ font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid #FFC0CB; border-radius:10px; background:#fff; color:var(--txt); width:100%; }
label{ font-size:12px; color:var(--txt-l); display:block; margin:8px 0 3px; }
/* 倒计时 */
.cd-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.cd-box{ background:var(--pink-ll); border-radius:16px; padding:14px; text-align:center; border:2px solid #FFD1DC; }
.cd-box .name{ font-size:13px; color:var(--txt-l); }
.cd-box .num{ font-size:34px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.cd-box .unit{ font-size:11px; color:var(--txt-l); }
/* 番茄钟 */
.pomo-wrap{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pomo-circle{ position:relative; width:140px; height:140px; flex-shrink:0; }
.pomo-circle svg{ transform:rotate(-90deg); }
.pomo-circle .t{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.pomo-circle .t .time{ font-size:26px; font-weight:bold; color:var(--pink); font-variant-numeric:tabular-nums; }
.pomo-circle .t .lab{ font-size:11px; color:var(--txt-l); }
/* 待办 */
.todo{ display:flex; align-items:center; gap:8px; background:#fff; border-radius:12px; padding:9px 10px; margin:6px 0; }
.todo input[type=checkbox]{ width:18px; height:18px; accent-color:var(--pink); flex-shrink:0; }
.todo.done span{ text-decoration:line-through; color:#bbb; }
.todo .del{ margin-left:auto; color:#E88; cursor:pointer; font-size:18px; }
/* 进度 */
.bar-bg{ height:18px; background:#FFD1DC; border-radius:10px; overflow:hidden; margin:6px 0; }
.bar-fill{ height:100%; background:linear-gradient(90deg,#FF9EC4,#FF69B4); border-radius:10px; transition:width .5s; }
.pct{ font-weight:bold; color:var(--pink); }
/* 公式 */
.formula{ background:var(--pink-ll); border-radius:12px; padding:10px; margin:6px 0; border-left:3px solid var(--pink); }
/* MCQ */
.mcq{ background:#fff; border-radius:14px; padding:14px; margin:10px 0; border:1px solid #FFD1DC; }
.mcq .q{ font-size:14px; margin-bottom:10px; line-height:1.6; }
.mcq .opt{ padding:9px 12px; background:var(--pink-ll); border-radius:10px; margin:6px 0; cursor:pointer; font-size:13px; transition:.15s; }
.mcq .opt:hover{ background:#FFE3EE; }
.mcq .opt.correct{ background:#C8F0D0; color:#1a7a3a; font-weight:bold; }
.mcq .opt.wrong{ background:#FFD3D3; color:#c33; }
.mcq .exp{ font-size:12px; color:var(--txt-l); margin-top:8px; line-height:1.6; display:none; }
/* 申论 */
.essay-quote{ background:linear-gradient(135deg,#FFF0F5,#FFE3EE); border-radius:14px; padding:14px; margin:8px 0; border-left:4px solid var(--pink); }
.essay-quote .q{ font-size:15px; line-height:1.7; color:var(--txt); font-style:italic; }
.essay-quote .t{ font-size:12px; color:var(--pink-d); margin-top:6px; }
.tab{ display:flex; gap:6px; margin-bottom:10px; }
.tab div{ padding:6px 14px; border-radius:12px; font-size:13px; background:var(--pink-l); color:var(--txt-l); cursor:pointer; }
.tab div.active{ background:var(--pink); color:#fff; }
/* 错题本 */
.mistake{ background:#fff; border-radius:14px; padding:12px; margin:8px 0; border:1px solid #FFD1DC; }
.mistake img{ max-width:100%; border-radius:10px; margin-top:8px; }
.mistake .meta{ font-size:11px; color:var(--txt-l); margin-top:6px; }
.tag{ display:inline-block; background:var(--pink); color:#fff; padding:2px 10px; border-radius:10px; font-size:11px; }
/* 统计 */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
.stat-box{ background:var(--pink-ll); border-radius:14px; padding:12px; text-align:center; }
.stat-box .n{ font-size:24px; font-weight:bold; color:var(--pink); }
.stat-box .l{ font-size:11px; color:var(--txt-l); }
/* 概览预览 */
.overview-mod{ display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:12px; padding:10px 12px; margin:5px 0; cursor:pointer; }
.overview-mod:active{ background:var(--pink-ll); }
.hidden{ display:none; }
.toast{ position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:50%; transform:translateX(-50%); background:var(--pink); color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; box-shadow:0 4px 15px rgba(255,105,180,.4); opacity:0; transition:.3s; z-index:999; pointer-events:none; }
.toast.show{ opacity:1; }
@media(max-width:420px){ .sidebar{ width:64px; } .nav-item{ width:54px; font-size:9px; } }

/* ===== iOS / 移动端优化 ===== */
input,textarea,select{ font-size:16px; }            /* 防止 iOS 输入框聚焦自动放大 */
body{ overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
.sidebar,.main{ -webkit-overflow-scrolling:touch; overscroll-behavior:none; }
.nav-item,.btn,.checkin-btn,.tab div,.overview-mod,.todo,.mcq .opt{ -webkit-touch-callout:none; }
* { -webkit-tap-highlight-color:transparent; }
@media (hover:hover){
  .mcq .opt:hover{ background:#FFE3EE; }
  .nav-item:hover{ background:rgba(255,105,180,.12); }
}
@media (max-width:430px){
  .sidebar{ width:72px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:env(safe-area-inset-bottom); }
  .nav-item{ width:62px; font-size:10px; padding:10px 2px; }
  .nav-item svg{ width:27px; height:27px; }
  .topbar{ padding:12px; gap:8px; }
  .topbar .clock{ font-size:19px; }
  .topbar .quote{ font-size:12px; }
  .checkin-btn{ padding:9px 12px; font-size:12px; }
  .main{ padding:10px; }
}
/* 安装引导横幅 */
.install-tip{ position:fixed; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(255,105,180,.97); color:#fff; border-radius:16px; padding:12px 14px;
  font-size:12.5px; line-height:1.55; box-shadow:0 6px 20px rgba(255,105,180,.5); z-index:998;
  display:none; align-items:center; gap:10px; }
.install-tip b{ font-weight:bold; }
.install-tip .x{ margin-left:auto; font-size:22px; line-height:1; cursor:pointer; opacity:.92; padding:0 4px; }

/* ===== 喵喵伙伴（与学习工作台合并） ===== */
.cat-area{ text-align:center; }
.cat-svg{ animation:breathe 2.5s ease-in-out infinite; }
.cat-svg img{ display:block; margin:0 auto; border-radius:20px; box-shadow:0 4px 15px rgba(255,105,180,.25); transition:transform .3s; }
.cat-svg.happy{ animation:shake .5s; }
@keyframes breathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes shake{0%,100%{transform:rotate(0);}25%{transform:rotate(-6deg);}75%{transform:rotate(6deg);}}
.cat-name{ font-size:18px; font-weight:bold; color:var(--pink); margin-top:4px; }
.cat-level{ display:inline-block; background:#FFB6C1; color:#fff; padding:2px 12px; border-radius:12px; font-size:12px; margin:4px 0; }
.bars{ margin:10px 0; }
.bar-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0; }
.bar-row span:first-child{ width:48px; text-align:right; color:var(--txt-l); }
.bar-bg{ flex:1; height:14px; background:#FFD1DC; border-radius:7px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:7px; transition:width .5s; }
.food{ background:linear-gradient(90deg,#FFB6C1,#FF69B4); }
.mood{ background:linear-gradient(90deg,#FFD700,#FFA500); }
.feed-btn{ background:linear-gradient(135deg,#FF9EC4,#FF69B4); color:#fff; border:none; padding:10px 24px; border-radius:20px; font-size:14px; cursor:pointer; margin-top:8px; box-shadow:0 3px 10px rgba(255,105,180,.4); -webkit-tap-highlight-color:transparent; }
.feed-btn:active{ transform:scale(.95); }
.feed-btn:disabled{ background:#E0C0CC; cursor:not-allowed; box-shadow:none; }
.fish{ position:fixed; opacity:0; font-size:28px; z-index:998; pointer-events:none; }
.tip-line{ font-size:12px; color:var(--txt-l); margin-top:8px; min-height:16px; }
.today-card{ background:#FFF0F5; border-radius:14px; padding:12px; margin-bottom:10px; }
.today-head{ display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:var(--pink); font-size:14px; margin-bottom:6px; }
.today-rate{ background:var(--pink); color:#fff; padding:1px 10px; border-radius:10px; font-size:13px; }
.today-theme{ font-size:12px; color:var(--txt-l); margin-bottom:8px; }
.today-task{ display:flex; align-items:flex-start; gap:8px; background:#fff; border-radius:10px; padding:9px 10px; margin:6px 0; cursor:pointer; font-size:13px; -webkit-tap-highlight-color:transparent; }
.today-task input{ margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:var(--pink); }
.today-task.done span{ text-decoration:line-through; color:#bbb; }
.today-tip{ font-size:12px; color:var(--txt-l); margin-top:8px; background:#fff; border-radius:8px; padding:6px 8px; }
.today-tip.ok{ color:var(--pink); font-weight:bold; }
.week-toggle{ text-align:center; font-size:13px; color:var(--pink); cursor:pointer; padding:8px; background:#FFE3EE; border-radius:12px; margin:6px 0; -webkit-tap-highlight-color:transparent; }
.week-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.wtab{ padding:4px 10px; border-radius:12px; font-size:12px; background:#FFE3EE; color:var(--txt-l); cursor:pointer; border:1px solid #FFC0CB; -webkit-tap-highlight-color:transparent; }
.wtab.active{ background:var(--pink); color:#fff; }
.week-theme{ font-size:13px; color:var(--txt-l); margin-bottom:10px; }
.day-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.day-col{ background:#FFF0F5; border-radius:10px; padding:5px 2px; text-align:center; font-size:10px; border:2px solid transparent; overflow:hidden; }
.day-col.today{ border-color:var(--pink); background:#FFE3EE; }
.day-col .dname{ font-weight:bold; color:var(--pink); margin-bottom:3px; }
.dtask{ background:#fff; border-radius:7px; padding:3px; margin:3px 0; display:flex; align-items:flex-start; gap:2px; cursor:pointer; text-align:left; }
.dtask input{ margin-top:1px; flex-shrink:0; width:11px; height:11px; accent-color:var(--pink); }
.dtask.done label{ text-decoration:line-through; color:#bbb; }
.dtask label{ line-height:1.25; cursor:pointer; font-size:9px; }
.progress-card{ margin-top:14px; }
.prog-bar-bg{ height:20px; background:#FFD1DC; border-radius:12px; overflow:hidden; margin:8px 0; }
.prog-bar-fill{ height:100%; background:linear-gradient(90deg,#FF9EC4,#FF69B4); border-radius:12px; transition:width .6s; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; color:#fff; font-size:12px; font-weight:bold; }
.prog-stats{ display:flex; gap:8px; }
.prog-stat{ flex:1; background:#FFF0F5; border-radius:12px; padding:8px; text-align:center; }
.prog-stat .n{ font-size:20px; font-weight:bold; color:var(--pink); }
.prog-stat .l{ font-size:10px; color:var(--txt-l); }
.weak-card{ background:#FFF0F5; border-radius:14px; padding:12px; margin-top:8px; border-left:4px solid var(--pink); }
.weak-tag{ display:inline-block; background:var(--pink); color:#fff; padding:1px 8px; border-radius:10px; font-size:11px; margin-bottom:6px; }

<script>
/* ============ localStorage 容错 ============ */
const _lsOK=(function(){try{localStorage.setItem('__mt','1');localStorage.removeItem('__mt');return true;}catch(e){return false;}})();
const _mem={};
function _lsGet(k){try{return _lsOK?localStorage.getItem(k):(_mem[k]??null);}catch(e){return _mem[k]??null;}}
function _lsSet(k,v){try{if(_lsOK)localStorage.setItem(k,v);else _mem[k]=v;}catch(e){_mem[k]=v;}}

/* ============ 日期工具 ============ */

function dayIndex(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}

/* ============ 状态 ============ */

 '倒计时':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/><path d="M12 2v2M12 20v2" stroke-linecap="round"/>',

let state=loadState();
function loadState(){
  let s={};
  try{ s=JSON.parse(_lsGet(LS)||'{}'); }catch(e){}
  s.checkin=s.checkin||{};
  s.study=s.study||{};
  s.formulas=s.formulas||defaultFormulas();
  s.mistakes=s.mistakes||[];
  s.points=s.points||[];
  if(s.mistakes.length && !s._migrated){  // 旧「错题本」数据迁移到「易错考点」
    s.points=s.points.concat(s.mistakes.map(m=>({id:'p'+Date.now()+Math.random().toString(36).slice(2,7),mod:m.mod,text:m.text,img:m.img,created:m.date||todayKey(),reviews:[],mastered:false})));
    s.mistakes=[]; s._migrated=true;
    try{ _lsSet(LS, JSON.stringify(s)); }catch(e){}
  }
  s.calendar=s.calendar||{start:'08:00',end:'22:00'};
  s.examDates=s.examDates||{ '国考':'2026-11-28','省考':'2027-03-28','事业编联考':'2026-10-25' };

  s.lastRollDay=s.lastRollDay||'';

  return s;
}
function save(){ _lsSet(LS,JSON.stringify(state)); }

/* ============ 数据备份（导出/导入） ============ */

/* ===== 导出复习清单（按模块打印 / 存 PDF） ===== */
function _groupBy(arr,key){ const g={}; arr.forEach(x=>{ const k=x[key]||'未分类'; (g[k]=g[k]||[]).push(x); }); return g; }
function _pointItemHTML(p){
  const prog=reviewProgress(p);
  const status=p.mastered?'<span style="color:#2a7;font-weight:700;">✅ 已掌握</span>':(isDue(p)?'<span style="color:#d33;font-weight:700;">🔁 待复习</span>':'<span style="color:#888;">⏳ 复习中 '+prog+'/6</span>');
  const nr=p.mastered?'—':nextReviewDate(p);
  return `<li style="margin-bottom:10px;"><div style="font-weight:600;">${escapeHtml(p.text)}</div><div style="font-size:12px;color:#555;margin-top:2px;">${status} · 下次复习 ${nr} · 已复习 ${prog} 轮</div></li>`;
}
function _bankItemHTML(b){
  const letters=['A','B','C','D','E'];
  const ans=letters[b.ans]||b.ans;
  const opts=(b.opts||[]).map((o,i)=>`${letters[i]}. ${escapeHtml(o)}`).join('　');
  const status=b.mastered?'<span style="color:#2a7;font-weight:700;">✅ 已掌握</span>':'<span style="color:#d33;font-weight:700;">🔁 待复习</span>';
  return `<li style="margin-bottom:12px;"><div style="font-weight:600;">${escapeHtml(b.q)}</div><div style="font-size:12px;color:#444;margin-top:3px;">${opts}</div><div style="font-size:12px;margin-top:3px;color:#1a5fb4;">【答案】${ans}</div><div style="font-size:12px;color:#666;margin-top:2px;">【解析】${escapeHtml(b.why||'（暂无）')}　${status}　对${b.right||0} 错${b.wrong||0}</div></li>`;

function _buildPrintHTML(title,statLine,groups,itemFn){
  const mods=Object.keys(groups);
  const body=mods.length?mods.map(m=>`<h2 style="font-size:15px;margin:14px 0 6px;color:#c41e6a;">📂 ${escapeHtml(m)}（${groups[m].length}）</h2><ol style="margin:0 0 0 18px;padding:0;">${groups[m].map(it=>itemFn(it)).join('')}</ol>`).join(''):'<div style="color:#888;">（暂无内容）</div>';
  return `<div style="font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#1a1a1a;line-height:1.6;padding:2px;">
    <h1 style="font-size:22px;margin:0 0 4px;border-bottom:3px solid #e84a8a;padding-bottom:8px;">${escapeHtml(title)}</h1>

    <div style="font-size:11px;color:#999;margin-top:18px;border-top:1px dashed #ccc;padding-top:8px;">由「考公学习工作台」生成 · 按模块归类，可直接打印或存为 PDF 复习</div>
  </div>`;
}
function exportReview(kind,modFilter){
  const pa=document.getElementById('printArea'); if(!pa){ toast('导出区未就绪'); return; }
  const now=todayKey();
  if(kind==='points'){
    let list=(state.points||[]).slice();

    const groups=_groupBy(list,'mod');
    const stat=`共 ${list.length} 个考点 · 已掌握 ${list.filter(p=>p.mastered).length} · 待复习 ${list.filter(p=>!p.mastered).length} · 导出 ${now}`;

    let list=(state.bank||[]).slice();
    if(modFilter && modFilter!=='全部') list=list.filter(b=>b.mod===modFilter);
    const groups=_groupBy(list,'mod');
    const stat=`共 ${list.length} 道题 · 已掌握 ${list.filter(b=>b.mastered).length} · 待复习 ${list.filter(b=>!b.mastered).length} · 导出 ${now}`;

function onImportFile(e){
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const txt=String(reader.result||'');
      const obj=JSON.parse(txt);
      if(typeof obj!=='object'||obj===null) throw new Error('文件格式不正确');
      _lsSet(LS,txt);
      state=loadState();
      try{ renderView(0); }catch(_){}
      try{ renderHomeCat(); renderHomePlan(); renderHomeWeak(); }catch(_){}
      alert('✅ 备份已导入，学习数据恢复成功！');
    }catch(err){ alert('导入失败：'+(err&&err.message||err)); }
  };
  reader.readAsText(file);
  e.target.value='';
}

function modStudy(m){ const ts=todayStudy(); if(!ts[m])ts[m]={todos:[],pomo:0,target:120}; return ts[m]; }

/* ============ 题库 ============ */

/* ============ 顶部：时钟/打卡/鸡汤 ============ */
function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  const wd=['日','一','二','三','四','五','六'][n.getDay()];
  document.getElementById('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 周${wd}`;
}
function renderTop(){
  document.getElementById('quote').textContent='"'+QUOTES[dayIndex()%QUOTES.length]+'"';
  const btn=document.getElementById('checkinBtn');
  if(state.checkin[todayKey()]){ btn.disabled=true; btn.textContent='✓ 今日已打卡'; }
  else { btn.disabled=false; btn.textContent='✓ 今日打卡'; }
  const sb=document.getElementById('streakBadge');
  if(sb){ const s=streakDays(); sb.textContent = s>0 ? ('🔥 连续 '+s+' 天') : '☘️ 今天开始打卡吧'; }
}
function streakDays(){
  let s=0; const d=new Date();
  if(!state.checkin[todayKey()]) d.setDate(d.getDate()-1); // 今天还没打卡则从昨天往前数
  while(true){ const k=d.toISOString().slice(0,10); if(state.checkin[k]){ s++; d.setDate(d.getDate()-1); } else break; }
  return s;
}
function doCheckin(){
  if(state.checkin[todayKey()]){ toast('今天已经打卡啦~'); return; }
  const y=new Date(); y.setDate(y.getDate()-1); const yk=y.toISOString().slice(0,10);
  const broken=!state.checkin[yk];
  state.checkin[todayKey()]=true; save(); renderTop();
  const s=streakDays();
  toast(broken ? ('🔥 中断后重新连击！当前连续 '+s+' 天') : ('🎉 打卡成功！连续 '+s+' 天，继续加油'));
}

/* ===== 番茄钟 ===== */
const pomoState={};
function pomoStart(mod){
  if(pomoState[mod]&&pomoState[mod].running)return;
  const ms=modStudy(mod);
  if(!pomoState[mod])pomoState[mod]={total:25*60,left:25*60,running:false};
  pomoState[mod].running=true;
  toast(mod+' 番茄钟开始，专注25分钟！');
  pomoState[mod].timer=setInterval(()=>{
    pomoState[mod].left--;
    const s=pomoState[mod]; const arc=document.getElementById('pomoArc_'+mod); const tm=document.getElementById('pomoTime_'+mod);
    if(arc){ const C=389; arc.setAttribute('stroke-dashoffset', C*(1-s.left/s.total)); }
    if(tm){ const m=Math.floor(s.left/60),sec=s.left%60; tm.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
    if(s.left<=0){ clearInterval(s.timer); s.running=false; ms.pomo+=25; save();
      const info=document.getElementById('pomoInfo_'+mod); if(info)info.innerHTML='今日已专注：<b class="pct">'+ms.pomo+'</b> 分钟';
      toast('🍅 '+mod+' 番茄钟完成！+25分钟'); pomoResetArc(mod); }
  },1000);
}
function pomoReset(mod){ if(pomoState[mod]&&pomoState[mod].timer)clearInterval(pomoState[mod].timer); pomoState[mod]={total:25*60,left:25*60,running:false}; pomoResetArc(mod); }
function pomoResetArc(mod){ const arc=document.getElementById('pomoArc_'+mod); const tm=document.getElementById('pomoTime_'+mod); if(arc)arc.setAttribute('stroke-dashoffset',389); if(tm)tm.textContent='25:00'; }

const FANWEN=[
  {t:'以“千万工程”经验绘就乡村全面振兴新画卷',th:'乡村振兴',body:'“千万工程”实施二十余年来，从人居环境整治的“小切口”，催生了乡村全面振兴的“大蝶变”，成为习近平新时代中国特色社会主义思想在“三农”领域的生动实践。写好乡村振兴这篇大文章，当以产业为基、以人才为要、以文化为魂。产业振兴是根本。要立足资源禀赋，做好“土特产”文章，推动一二三产融合，让农民在家门口鼓起“钱袋子”。人才振兴是关键。既要引得回“归巢雁”，完善返乡创业政策；也要育得好“土专家”，壮大本土人才队伍。文化振兴是抓手。保护古树名村，活化非遗民俗，让乡愁有寄托、乡风更文明。新征程上，锚定“农村基本具备现代生活条件”目标，一张蓝图绘到底、一茬接着一茬干，广袤乡村必将铺展宜居宜业的和美画卷。',src:'权威论述：中共中央、国务院《乡村全面振兴规划（2024—2027年）》；“千万工程”入选联合国“最佳减贫案例”。可结合浙江“村晚”、返乡创业、土特产加工等案例'},
  {t:'以新质生产力撬动高质量发展新动能',th:'新质生产力',body:'高质量发展是全面建设社会主义现代化国家的首要任务，而新质生产力正是其核心驱动力。新质生产力，特点在“新”，关键在“质”，本质是创新起主导作用、符合高质量发展要求的生产力。培育新质生产力，要牵住科技创新“牛鼻子”。瞄准人工智能、量子信息、生物医药等前沿领域，打好关键核心技术攻坚战，把发展主动权牢牢握在自己手中。要写好产业升级“大文章”。以“人工智能+”赋能千行百业，推动传统产业高端化、智能化、绿色化转型，让老树发新枝、新树扎深根。要激活人才这一“第一资源”。完善人才培养、引进、使用机制，让各类人才的创新活力竞相迸发。向“新”而行、以“质”取胜，中国经济必将在新旧动能转换中行稳致远。',src:'权威论述：习近平总书记在中共中央政治局第十一次集体学习时强调“发展新质生产力是推动高质量发展的内在要求和重要着力点”；可结合“人工智能+”、专精特新“小巨人”、北斗/神舟等案例'},
  {t:'守护绿水青山 厚植高质量发展底色',th:'绿色发展',body:'“绿水青山就是金山银山”，深刻揭示了生态保护与经济发展的辩证统一。守护绿水青山，既是民心所向，更是发展所需。守护之本在系统治理。像保护眼睛一样保护生态环境，统筹山水林田湖草沙一体化保护和修复，让“绿色家底”更厚实。转化之道在生态惠民。健全生态产品价值实现机制，发展林下经济、生态旅游、碳汇交易，把“好风景”变成“好钱景”。长效之基在制度护航。落实河长制、林长制，完善生态补偿和生态环境分区管控，用最严格制度守住自然生态安全边界。人不负青山，青山定不负人。当绿色成为高质量发展的鲜明底色，美丽中国必将铺展人与自然和谐共生的壮美画卷。',src:'权威论述：习近平生态文明思想；“绿水青山就是金山银山”理念写入党章。可结合塞罕坝林场、新安江生态补偿、新能源产业等案例'},
  {t:'坚持和发展新时代“枫桥经验” 提升基层治理效能',th:'基层治理',body:'基层强则国家强，基层安则天下安。新时代“枫桥经验”从“一镇之计”上升为推进国家治理现代化的“一国之策”，彰显了“依靠群众、就地化解”的治理智慧。写好基层治理这篇大文章，要坚持党建引领。把基层党组织建设成坚强战斗堡垒，健全“网格化”管理，让群众的事有人管、有人办。要践行群众路线。畅通诉求表达渠道，推动“小事不出村、大事不出镇、矛盾不上交”，把问题解决在萌芽状态。要善用数字赋能。以“城市大脑”“数字乡村”提升治理精度，让数据多跑路、群众少跑腿。治理的“最后一公里”，正是服务群众的“最美一公里”。',src:'权威论述：习近平同志指出“各级党委和政府要充分认识‘枫桥经验’的重大意义，发扬优良作风，适应时代要求，创新群众工作方法，善于运用法治思维和法治方式解决涉及群众切身利益的矛盾和问题”。适用“基层治理”“矛盾化解”“信访工作”主题'},
  {t:'在高质量发展中书写民生答卷',th:'民生保障',body:'“为民造福是立党为公、执政为民的本质要求。”发展的温度，归根到底要看民生厚度。增进民生福祉，要在“急难愁盼”上用力。聚焦就业、教育、医疗、养老、住房等群众最关心的事，把惠民生的事办实、暖民心的事办细。要在“公平正义”上用功。推动基本公共服务均等化，织密社会保障网，让发展成果更多更公平惠及全体人民。要在“长效机制”上用心。健全为民办实事机制，把好事实事做到群众心坎上，不搞“形象工程”。江山就是人民，人民就是江山。把民生答卷写进群众笑脸里，才是高质量发展的真正注脚。',src:'权威论述：党的二十大报告“增进民生福祉，提高人民生活品质”专章。可结合药品集中带量采购、城镇老旧小区改造、“双减”政策等权威案例'},
  {t:'实现高水平科技自立自强',th:'科技创新',body:'科技兴则民族兴，科技强则国家强。面对新一轮科技革命和产业变革，唯有把科技的命脉牢牢掌握在自己手中，才能赢得发展主动。实现高水平科技自立自强，要打好关键核心技术攻坚战。瞄准人工智能、量子信息、集成电路等前沿领域，集合优势资源协同攻关，破解“卡脖子”难题。要强化企业创新主体地位。支持专精特新“小巨人”企业成长，推动产学研深度融合，让创新链、产业链、资金链、人才链环环相扣。要夯实人才根基。完善育才、引才、用才机制，营造鼓励创新、宽容失败的氛围。抓创新就是抓发展，谋创新就是谋未来。',src:'权威论述：党的二十大报告提出“教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑”，并强调“科技是第一生产力、人才是第一资源、创新是第一动力”。可结合北斗导航、C919大飞机、国产芯片突破等案例'},
  {t:'坚定文化自信 铸就中华文化新辉煌',th:'文化自信',body:'“没有高度的文化自信，没有文化的繁荣兴盛，就没有中华民族伟大复兴。”中华文化源远流长、博大精深，是民族复兴的精神支撑。坚定文化自信，要守护好“根”与“魂”。加强文物保护利用和文化遗产保护传承，让敦煌、良渚、非遗等活起来、传下去。要推动创造性转化、创新性发展。以时代精神激活传统文化生命力，让国潮、文创、文博持续“出圈”，讲好中国故事。要建设具有强大凝聚力和引领力的社会主义意识形态。广泛践行社会主义核心价值观，凝聚团结奋斗的精神力量。文化兴则国运兴，唯有薪火相传、守正创新，方能铸就中华文化新辉煌。',src:'权威论述：2023年全国宣传思想文化工作会议正式提出习近平文化思想，明确“七个着力”，强调“着力赓续中华文脉、推动中华优秀传统文化创造性转化和创新性发展”。可结合“何以中国”、非遗年味、文博热等案例'},

function setCal(k,v){ state.calendar[k]=v; save(); toast('已保存'); }
function doMakeup(){

/* ===== 易错考点（艾宾浩斯复习排程） ===== */
const REVIEW_INTERVALS=[1,2,4,7,15,30];   // 艾宾浩斯复习间隔(天)
function nextReviewDate(p){
  const base=new Date((p.created||todayKey())+'T00:00:00');
  const gap=REVIEW_INTERVALS[Math.min(p.reviews.length,REVIEW_INTERVALS.length-1)];
  base.setDate(base.getDate()+gap);
  return base.toISOString().slice(0,10);
}
function isDue(p){ if(p.mastered)return false; return todayKey()>=nextReviewDate(p); }
function todayReviewCount(){ return (state.points||[]).filter(isDue).length; }
function reviewProgress(p){ return Math.min(p.reviews.length,REVIEW_INTERVALS.length); }

function viewPoints(){
  const all=state.points||[];
  const due=todayReviewCount();
  const overdue=(all.filter(p=>!p.mastered && isDue(p) && nextReviewDate(p)<todayKey())).length;
  let h=`<div class="card"><h2>🎯 易错考点</h2>
    <div class="point-stat">
      <div class="ps-box"><div class="n">${due}</div><div class="l">今日需复习</div></div>
      <div class="ps-box"><div class="n">${all.length}</div><div class="l">考点总数</div></div>
      <div class="ps-box"><div class="n">${all.filter(p=>p.mastered).length}</div><div class="l">已掌握</div></div>
    </div>
    ${overdue?`<div class="overdue-tip">⚠️ 有 ${overdue} 个考点已逾期（超过计划复习日），建议优先补复习</div>`:''}
    <h3>📌 今日需复习（艾宾浩斯智能排程）</h3>
    <div id="pointToday"></div>
    <h3>➕ 导入易错考点</h3>
    <div class="seg">
      <div class="seg-i active" id="impTab0" onclick="switchImport(0)">单条添加</div>
      <div class="seg-i" id="impTab1" onclick="switchImport(1)">批量粘贴</div>
      <div class="seg-i" id="impTab2" onclick="switchImport(2)">截图识别</div>
    </div>
    <div id="imp0">
      <div class="row"><select id="pointMod" style="flex:1;">${MODULES.slice(1,8).map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div>
      <label>考点内容 / 易错原因 / 正确思路</label>
      <textarea id="pointText" rows="3" placeholder="例：资料分析·截位直除时单位换算出错（万/亿）…"></textarea>
      <label>配图（题目截图，可选）</label>
      <input type="file" id="pointImg" accept="image/*">
      <button class="btn" style="margin-top:8px;" onclick="addPoint()">+ 保存考点</button>
    </div>
    <div id="imp1" style="display:none;">
      <div style="font-size:12px;color:#a35;line-height:1.6;">从粉笔错题本复制后粘贴，每行一条。格式：<b>模块|内容</b>（模块可省略，默认用上方所选模块）。例：<br>言语理解|细节题偷换概念<br>资料分析|截位直除单位换算（万/亿）出错</div>
      <textarea id="batchText" rows="6" style="width:100%;margin-top:8px;border-radius:10px;border:1px solid #FFD3E6;padding:8px;font-size:13px;" placeholder="言语理解|……
资料分析|……
（每行一条）"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn" style="flex:1" onclick="batchImportPoints()">📥 导入</button>
      </div>
    </div>
    <div id="imp2" style="display:none;">
      <label>上传错题截图</label>
      <input type="file" id="ocrImg" accept="image/*" onchange="previewOcr(this)">
      <div id="ocrPrev" style="margin-top:8px;"></div>
      <div style="font-size:12px;color:#a35;line-height:1.7;margin-top:8px;background:#FFF6FA;border-radius:10px;padding:10px;">
        📷 <b>截图识别怎么用：</b><br>
        1. 上传截图后<b>长按预览图保存到相册</b>；<br>
        2. 回到对话框把图<b>发给我</b>，我会 OCR 识别成文字；<br>
        3. 复制我整理好的文字，切回「批量粘贴」Tab 一键导入。<br>
        <span style="color:#bbb;">（纯前端版暂不支持自动识别，自动识别由 AI 对话完成）</span>

      <button class="btn ghost" style="margin-top:8px;" onclick="switchImport(1)">➡️ 去批量粘贴</button>

      <button class="btn ghost" style="flex:1" onclick="exportReview('points')">📤 导出复习清单(PDF)</button>

function addPoint(){
  const mod=document.getElementById('pointMod').value;
  const text=document.getElementById('pointText').value.trim();
  const file=document.getElementById('pointImg').files[0];
  if(!text&&!file){ toast('请填写内容或上传图片'); return; }
  const done=(imgData)=>{
    state.points.unshift({id:'p'+Date.now()+Math.random().toString(36).slice(2,7),mod,text,img:imgData,created:todayKey(),reviews:[],mastered:false}); save();
    document.getElementById('pointText').value=''; document.getElementById('pointImg').value='';
    renderPoints(); toast('考点已加入复习计划 🎯');
  };
  if(file){
    const r=new FileReader();
    r.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); const max=800; let w=img.width,h=img.height; if(w>max){h=h*max/w;w=max;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); done(c.toDataURL('image/jpeg',0.7)); }; img.src=e.target.result; };
    r.readAsDataURL(file);
  } else done(null);
}
function markPoint(id,type){
  const p=(state.points||[]).find(x=>x.id===id); if(!p)return;
  p.reviews.push(todayKey());
  if(type==='mastered' || p.reviews.length>=REVIEW_INTERVALS.length) p.mastered=true;
  save(); renderPoints();
  toast(type==='mastered'?'已掌握，太棒了！🎉':'复习已记录，明天继续 💪');
}
function delPoint(id){ state.points=state.points.filter(p=>p.id!==id); save(); renderPoints(); }
function toggleBatch(){ const b=document.getElementById('pointBatch'); if(b) b.style.display = b.style.display==='none'?'block':'none'; }
function switchImport(i){
  for(let k=0;k<3;k++){
    const p=document.getElementById('imp'+k); if(p) p.style.display = k===i?'block':'none';
    const t=document.getElementById('impTab'+k); if(t) t.classList.toggle('active',k===i);
  }
}
function previewOcr(input){
  const prev=document.getElementById('ocrPrev'); if(!prev)return;
  const f=input.files&&input.files[0]; if(!f){ prev.innerHTML=''; return; }
  const r=new FileReader(); r.onload=e=>{ prev.innerHTML=`<img src="${e.target.result}" style="max-width:100%;border-radius:10px;border:1px solid #FFD3E6;">`; }; r.readAsDataURL(f);
}
function batchImportPoints(){
  const ta=document.getElementById('batchText');
  const lines=(ta.value||'').split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('请先粘贴要导入的考点'); return; }
  const defMod=document.getElementById('pointMod').value;
  const known=new Set(MODULES.slice(1,8));
  let added=0;
  lines.forEach(line=>{
    let mod=defMod, text=line;
    const m=line.match(/^(.+?)[｜|：:]\s*(.+)$/);
    if(m){ const cand=m[1].trim(); if(known.has(cand)){ mod=cand; text=m[2].trim(); } }
    if(!text)return;
    state.points.unshift({id:'p'+Date.now()+Math.random().toString(36).slice(2,7),mod,text,img:null,created:todayKey(),reviews:[],mastered:false});
    added++;
  });
  save(); ta.value=''; renderPoints();
  toast('已批量导入 '+added+' 个考点 📥');
}
function renderPoints(){
  const all=state.points||[];
  const dueBox=document.getElementById('pointToday');
  const allBox=document.getElementById('pointAll');
  if(!dueBox||!allBox)return;
  const due=all.filter(isDue);
  if(!due.length){ dueBox.innerHTML='<div style="font-size:12px;color:#bbb;">🎉 今天没有待复习的考点，保持节奏！</div>'; }
  else dueBox.innerHTML=due.map(p=>`<div class="ptoday"><span class="tag">${p.mod}</span><span style="float:right;font-size:11px;color:#bbb;">下次 ${nextReviewDate(p)}</span><div style="margin-top:6px;font-size:13px;line-height:1.6;">${escapeHtml(p.text)}</div>${p.img?`<img src="${p.img}" style="max-width:100%;border-radius:10px;margin-top:6px;">`:''}<div class="ptoday-btns"><button class="btn" style="flex:1" onclick="markPoint('${p.id}','mastered')">✅ 已掌握</button><button class="btn ghost" style="flex:1" onclick="markPoint('${p.id}','review')">🔁 需复习</button></div></div>`).join('');
  if(!all.length){ allBox.innerHTML='<div style="font-size:12px;color:#bbb;">还没有考点，把常错的知识点记下来吧~</div>'; }
  else allBox.innerHTML=all.map(p=>`<div class="ptall"><span class="tag">${p.mod}</span>${p.mastered?'<span class="badge-ok">已掌握</span>':`<span class="badge-due">${reviewProgress(p)}/6轮</span>`}<span class="del" style="float:right;cursor:pointer;color:#E88;font-size:18px;" onclick="delPoint('${p.id}')">×</span><div style="margin-top:4px;font-size:13px;line-height:1.6;">${escapeHtml(p.text)}</div></div>`).join('');
}

function answerBank(i){
  const b=quizCur; if(!b)return;
  const corr=b.ans; b.right=b.right||0; b.wrong=b.wrong||0;
  if(i===corr){ b.right++; toast('✅ 答对了！'); }
  else { b.wrong++; b.reviews=b.reviews||[]; b.reviews.push(todayKey()); if(b.reviews.length>=REVIEW_INTERVALS.length) b.mastered=true; toast('❌ 答错啦，已加入待复习'); }
  save();
  const letters=['A','B','C','D','E'];
  const fb=document.getElementById('bankQuizFB');
  if(fb)fb.innerHTML=`<div class="qfb ${i===corr?'ok':'err'}">${i===corr?'✅ 回答正确':'❌ 正确答案：'+letters[corr]}</div><div class="mcq-why">💡 ${escapeHtml(b.why||'（暂无解析）')}</div><button class="btn" style="margin-top:8px;" onclick="quizNext()">下一题 →</button>`;
  document.querySelectorAll('.qopt').forEach(el=>{ el.classList.add('disabled'); const ii=+el.dataset.i; if(ii===corr)el.classList.add('correct'); if(ii===i&&i!==corr)el.classList.add('wrong'); });
  quizCur=null;
}

function previewBankOcr(input){ const prev=document.getElementById('bankOcrPrev'); if(!prev)return; const f=input.files&&input.files[0]; if(!f){prev.innerHTML='';return;} const r=new FileReader(); r.onload=e=>{ prev.innerHTML=`<img src="${e.target.result}" style="max-width:100%;border-radius:10px;border:1px solid #FFD3E6;">`; }; r.readAsDataURL(f); }
function batchImportBank(){
  const ta=document.getElementById('bankText');
  const lines=(ta.value||'').split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('请先粘贴题目'); return; }
  const known=new Set(MODULES.slice(1,8));
  let added=0;
  lines.forEach(line=>{
    const f=line.split('|');
    if(f.length<5) return;
    let mod=f[0].trim(), q=f[1].trim();
    if(!known.has(mod)){ q=mod+' '+q; mod='言语理解'; }
    const why=f[f.length-1].trim();
    const ansField=f[f.length-2].trim();
    const opts=f.slice(2,f.length-2).map(o=>o.trim()).filter(Boolean);
    if(!opts.length || !q) return;
    const a=ansField.toUpperCase(); let ai=0;
    if(/^[A-E]$/.test(a)) ai=a.charCodeAt(0)-65;
    else if(/^\d+$/.test(a)) ai=Math.max(0,parseInt(a)-1);
    else { const m=a.match(/[A-E]/); if(m) ai=m[0].charCodeAt(0)-65; }
    if(ai>=opts.length) ai=0;
    state.bank.unshift({id:'b'+Date.now()+Math.random().toString(36).slice(2,7),mod,q,opts,ans:ai,why,img:null,created:todayKey(),reviews:[],mastered:false,right:0,wrong:0});
    added++;
  });
  save(); ta.value='';
  toast('已导入 '+added+' 道题 📚');
  bankTab=0; switchBankTab(0);
}

/* ===== AI 智能诊断（本地启发式引擎） ===== */
function aiDiagnose(){
  const today=new Date(); today.setHours(0,0,0,0);
  const d7=[]; for(let k=6;k>=0;k--){ const d=new Date(today); d.setDate(d.getDate()-k); d7.push(d.toISOString().slice(0,10)); }
  let totalTodo=0, doneTodo=0; const pomo={};
  d7.forEach(d=>{ const mods=state.study[d]; if(!mods)return; Object.entries(mods).forEach(([mod,ms])=>{ const ts=ms.todos||[]; totalTodo+=ts.length; doneTodo+=ts.filter(t=>t.done).length; pomo[mod]=(pomo[mod]||0)+(ms.pomo||0); }); });
  const rate= totalTodo? Math.round(doneTodo/totalTodo*100):0;
  const weakCnt={}; (state.points||[]).forEach(p=>{ if(!p.mastered) weakCnt[p.mod]=(weakCnt[p.mod]||0)+1; });
  const weak=Object.entries(weakCnt).sort((a,b)=>b[1]-a[1]);
  const checked7=d7.filter(d=>state.checkin[d]).length;
  const tips=[];
  if(totalTodo>0 && rate<60) tips.push({lv:'高',t:'计划偏满，完成率仅 '+rate+'%',a:'建议每日任务量减 20-30%，优先保核心模块，避免挫败。'});
  else if(rate>=85 && totalTodo>0) tips.push({lv:'优',t:'完成率优秀 '+rate+'%',a:'节奏很好，可适度加量冲刺薄弱模块。'});
  if(weak.length){ const wm=weak[0][0], wc=weak[0][1]; tips.push({lv:'高',t:'「'+wm+'」易错最多（'+wc+' 个未掌握）',a:'每天优先安排 30 分钟专项突破，配合错题重做。'}); }
  const core=['资料分析','数量关系','逻辑判断','言语理解']; let lowMod=null,lowVal=1e9;
  core.forEach(m=>{ const vv=pomo[m]||0; if(vv<lowVal){lowVal=vv;lowMod=m;} });
  if(lowMod && lowVal<30 && totalTodo>0) tips.push({lv:'中',t:lowMod+' 近7天专注仅 '+lowVal+' 分',a:'该模块是提分关键，建议每天固定 1 篇/组练习，用番茄钟保底。'});
  if(checked7<5) tips.push({lv:'中',t:'近7天仅打卡 '+checked7+' 天',a:'连续打卡显著提升坚持率，建议固定时段启动学习。'});
  const mastered=(state.points||[]).filter(p=>p.mastered).length;
  if(mastered>0) tips.push({lv:'优',t:mastered+' 个考点已掌握',a:'复习闭环见效，保持艾宾浩斯节奏。'});
  if(!tips.length) tips.push({lv:'优',t:'数据样本不足',a:'多记录几天学习数据，AI 诊断会更精准。'});
  return {rate,checked7,weak,tips};
}
function renderAI(){ const box=document.getElementById('aiBox'); if(!box)return; const r=aiDiagnose();
  let s='<div class="ai-summary">近7天完成率 <b>'+r.rate+'%</b> · 打卡 '+r.checked7+'/7 · 高频易错：'+(r.weak[0]?r.weak[0][0]+'('+r.weak[0][1]+')':'无')+'</div>';

}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

const WEAK_ROTATE=['数量关系·工程问题（设总量为公倍数）','图推·点线面角素规律','资料分析·截位直除速算','数量关系·代入排除法','图推·对称与位置变化'];
const WEAK_KNOWLEDGE={
  '数量关系':[
    {t:'工程问题核心公式', b:'工作总量 = 效率 × 时间。题没给具体量时，把总量设为各时间的公倍数（如甲15天、乙10天→设总量30），效率=总量÷时间，合作效率=效率和。'},
    {t:'代入排除法', b:'数量关系第一招：先代入选项验证，不用硬算。优先验证居中选项或整除关系明显的。年龄、余数、不定方程题尤其好用。'},
    {t:'年龄问题', b:'年龄差永远不变！抓住"几年后/几年前"的等量关系列方程，或画时间轴对比。'},
    {t:'行程问题', b:'S=V×T 是根。相遇：S=(V1+V2)×t；追及：S差=(V1-V2)×t。画图比列式更直观。'}
  ],
  '图推':[
    {t:'点线面角素', b:'数元素数量找规律：点（交点）、线（直线/笔画数）、面（封闭区域）、角（直角/锐角）、素（独立小图形个数）。笔画数=奇点数÷2。'},
    {t:'对称性', b:'轴对称（对称轴数量/方向）、中心对称（旋转180°重合）、既是轴对称又是中心对称。近年高频考点。'},
    {t:'位置变化', b:'平移（方向+步数）、旋转（顺时针/逆时针+角度）、翻转（上下/左右）。看元素是否"动"。'},
    {t:'叠加与遍历', b:'去同存异、去异存同、黑白叠加（按规则变色）；遍历则每行每列元素种类齐全。'}
  ],
  '资料分析':[
    {t:'截位直除法', b:'除法保留前三位有效数字计算。选项差距大截两位，差距小截三位。例：3456÷1.23≈346÷0.123，快速得量级和首数。'},
    {t:'特殊分数转化', b:'1/2=50%、1/3≈33.3%、1/4=25%、1/5=20%、1/6≈16.7%、1/8=12.5%、1/9≈11.1%。看到百分数先想对应分数，乘法变除法。'},
    {t:'速算陷阱', b:'单位换算（万/亿）、时间范围（同比/环比）、基期现期别搞反。单篇控制在7分钟内，正确率冲85%+。'}
  ],
  '申论':[
    {t:'材料分层找点法', b:'读材料时按"主体/维度"分层，每段圈出关键词（名词+动词短语），归纳概括直接按层分条写，要点不漏。'},
    {t:'大作文五段式', b:'开头亮论点→分论点1(理证+例证)→分论点2→分论点3→结尾回扣升华。每个分论点嵌1句金句+1个例子。'},
    {t:'小题按词给分', b:'阅卷按关键词找点，用①②③分条，每条"核心词+展开"。先在材料里找全要点，再组织语言，别脱离材料自由发挥。'}
  ]
};
const DAY_NAMES=['周一','周二','周三','周四','周五','周六','周日'];
function getWeekDay(){
  const now=new Date();
  const diff=Math.floor((now-PLAN_START)/86400000);
  const started=diff>=0;
  let week=Math.floor(diff/7); if(week<0)week=0; if(week>15)week=15;
  let day=((diff%7)+7)%7;
  if(!started){ week=0; day=0; }
  return {week,day,diff,started};
}
function getDayTasks(week,day){
  const w=WEEKS[week];
  if(day===5) return ['行测套题1套（限时120分钟）','错题精析+复盘'];
  if(day===6) return (week>=13)?['★全真模考：行测+申论','模考复盘总结']:['申论完整1套（含大作文）','对照范文修改'];
  const weak=WEAK_ROTATE[day];
  return [w.core,'弱点补强：'+weak,'申论金句背5句+例子1个'];
}
/* 首页伙伴卡片（静态结构，动态部分由下方函数填充） */

/* 小猫 */
function renderHomeCat(){
  const tk=todayKey();
  if(state.cat.day!==tk){ state.cat.day=tk; state.cat.food=0; state.cat.mood=0; save(); }
  const food=state.cat.food||0, m=state.cat.mood||0, grow=state.cat.grow||0;
  const bf=document.getElementById('homeBarFood'); if(bf)bf.style.width=food+'%';
  const bm=document.getElementById('homeBarMood'); if(bm)bm.style.width=m+'%';
  const lv=Math.floor(grow/10);
  const names=['奶猫','小猫','大猫','猫学长','猫科长','猫局长','猫司长','资深猫局长','上岸猫','公务员猫'];
  const cl=document.getElementById('homeCatLevel'); if(cl)cl.textContent='Lv.'+(lv+1)+' '+names[Math.min(lv,9)];
  const fed=state['fed_'+tk]==='1';
  showFace(fed?'happy':(food>=80?'normal':'hungry'));
  const tip=document.getElementById('homeCatTip');
  if(tip)tip.textContent = fed ? '团子吃得好满足~ 明天也要来打卡哦 💕' : (food>=80?'团子馋小鱼干啦，快去喂它~':'团子饿肚子了😿，先去完成今日任务吧！');
}
function showFace(type){
  ['eyesN','eyesH','eyesA'].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
  ['mouthN','mouthH','mouthA'].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
  const map={normal:['eyesN','mouthN'],happy:['eyesH','mouthH'],hungry:['eyesA','mouthA']};
  map[type].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='';});
}
function feedCat(){
  const tk=todayKey();
  if(state['fed_'+tk]==='1'){ toast('今天已经喂过团子啦，明天见~ 😊'); return; }
  const wd=getWeekDay();
  const {week,day}=wd;
  const tTasks=getDayTasks(week,day); let tDone=0;
  tTasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+day+'-'+i]==='1') tDone++; });
  const roll=state.roll||[]; let rDone=0; roll.forEach(r=>{ if(r.done) rDone++; });
  const total=tTasks.length+roll.length;
  if(wd.started && total>0 && (tDone+rDone)/total<0.8){ toast('先完成今日80%任务才能喂猫哦~'); return; }
  const fish=document.getElementById('homeFish');
  if(fish){ fish.style.cssText='position:fixed;right:24px;top:50%;font-size:28px;opacity:1;transition:all .8s;z-index:998;'; setTimeout(()=>{ fish.style.right='50%'; fish.style.top='40%'; },10); setTimeout(()=>{ fish.style.opacity='0'; },800); }
  state['fed_'+tk]='1'; state.cat.food=100; state.cat.mood=100; state.cat.grow=(state.cat.grow||0)+2; save();
  renderHomeCat();
  const catImg=document.getElementById('homeCatImg'); if(catImg){ catImg.style.transform='scale(1.2)'; setTimeout(()=>catImg.style.transform='',500); }
  const wrap=document.getElementById('homeCatSvg'); if(wrap){ wrap.classList.add('happy'); setTimeout(()=>wrap.classList.remove('happy'),500); }
  const tip=document.getElementById('homeCatTip'); if(tip)tip.textContent='团子吃得好开心！喵呜~ 明天也要来打卡哦 💕';
  toast('🐟 团子吃到了小鱼干，心情+100！');
  updatePlanProgress(week,day);
}
/* 16周计划 */
function rollForwardIfNewDay(){
  const tk=todayKey();
  if(state.lastRollDay===tk) return;
  state.lastRollDay=tk; save();
  const y=new Date(); y.setDate(y.getDate()-1);
  const diff=Math.floor((y-PLAN_START)/86400000);
  if(diff>=0){
    const wk=Math.min(Math.floor(diff/7),15);
    const dy=((diff%7)+7)%7;
    getDayTasks(wk,dy).forEach((task,i)=>{
      const key='plan_'+wk+'-'+dy+'-'+i;
      if(state[key]!=='1' && !state.roll.some(r=>r.key===key)) state.roll.push({key,text:task,done:false});
    });
    save();
  }
}
function renderHomePlan(){
  if(!document.getElementById('homeTodayCard'))return;
  rollForwardIfNewDay();
  const {week,day,started}=getWeekDay();
  renderHomeToday(week,day,started);
  renderHomeWeekTabs(week);
  renderHomeWeek(week,day);
  updatePlanProgress(week,day);
}
function renderHomeToday(week,day,started){
  if(!started){
    const startStr=PLAN_START.toISOString().slice(0,10);
    let html='<div class="today-head"><span>📅 计划明天（'+startStr+'）开始</span></div>';
    html+='<div class="today-theme">📌 第1周主题：'+WEEKS[0].theme+'</div>';
    html+='<div style="font-size:12px;color:#a35;margin:6px 0;">首日任务预览：</div>';
    getDayTasks(0,0).forEach(task=>{ html+='<label class="today-task"><span>'+task+'</span></label>'; });
    html+='<div class="today-tip">今天做好启航准备，明天正式开始 16 周冲刺 🚀</div>';
    const el=document.getElementById('homeTodayCard'); if(el)el.innerHTML=html;
    return;
  }
  const w=WEEKS[week]; const tasks=getDayTasks(week,day);
  let done=0; tasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+day+'-'+i]==='1') done++; });
  const roll=state.roll||[]; let rollDone=0; roll.forEach(r=>{ if(r.done) rollDone++; });
  const totalTasks=tasks.length+roll.length;
  const totalDone=done+rollDone;
  const rate=totalTasks?Math.round(totalDone/totalTasks*100):0;
  let html='<div class="today-head"><span>第'+(week+1)+'周 · '+DAY_NAMES[day]+'</span><span class="today-rate">'+rate+'%</span></div>';
  html+='<div class="today-theme">📌 '+w.theme+'</div>';
  tasks.forEach((task,i)=>{
    const checked=state['plan_'+week+'-'+day+'-'+i]==='1';
    html+='<label class="today-task'+(checked?' done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="togglePlanTask('+week+','+day+','+i+')"><span>'+task+'</span></label>';
  });
  if(roll.length){
    html+='<div class="roll-box"><div class="roll-title">📥 顺延自昨日的任务</div>';
    roll.forEach((r,i)=>{
      html+='<label class="today-task'+(r.done?' done':'')+'"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggleRoll('+i+')"><span>'+r.text+'</span></label>';
    });
    html+='</div>';
  }
  if(totalDone<totalTasks) html+='<div class="today-tip">还差 '+(totalTasks-totalDone)+' 项完成，完成80%就能喂团子啦~ 🐟</div>';
  else html+='<div class="today-tip ok">今日任务全部完成！去喂团子吧 🐟</div>';
  const el=document.getElementById('homeTodayCard'); if(el)el.innerHTML=html;
}
function togglePlanTask(week,day,i){
  const k='plan_'+week+'-'+day+'-'+i;
  state[k]=state[k]==='1'?'0':'1'; save();
  const d=getWeekDay().day;
  renderHomeToday(week,d); renderHomeWeek(week,d); updatePlanProgress(week,d);
}
function toggleRoll(i){
  const r=state.roll[i]; if(!r)return;
  r.done=!r.done;
  if(r.done) state.roll.splice(i,1);   // 完成后移除，保持整洁
  save();
  const wd=getWeekDay(); renderHomeToday(wd.week,wd.day,wd.started); renderHomeWeek(wd.week,wd.day); updatePlanProgress(wd.week,wd.day);
}
let homeWeek=null;
function renderHomeWeekTabs(week){
  const tabs=document.getElementById('homeWeekTabs'); if(!tabs)return;
  tabs.innerHTML='';
  for(let i=Math.max(0,week-1);i<=Math.min(15,week+1);i++){
    const t=document.createElement('div'); t.className='wtab'+(i===week?' active':'');
    t.textContent='第'+(i+1)+'周'; t.onclick=()=>{ homeWeek=i; renderHomeWeek(homeWeek,getWeekDay().day); };
    tabs.appendChild(t);
  }
}
function renderHomeWeek(week,todayDay){
  homeWeek=week;
  const w=WEEKS[week];
  const theme=document.getElementById('homeWeekTheme'); if(theme)theme.innerHTML='📌 第'+(week+1)+'周 · '+w.theme;
  const grid=document.getElementById('homeDayGrid'); if(!grid)return;
  grid.innerHTML='';
  for(let d=0;d<7;d++){
    const col=document.createElement('div'); col.className='day-col'+(d===todayDay?' today':'');
    const tasks=getDayTasks(week,d);
    let html='<div class="dname">'+(d===todayDay?'🔥':'')+DAY_NAMES[d]+'</div>';
    tasks.forEach((task,i)=>{
      const key=week+'-'+d+'-'+i; const done=state['plan_'+key]==='1';
      html+='<div class="dtask'+(done?' done':'')+'" onclick="togglePlanTask('+week+','+d+','+i+')"><input type="checkbox" '+(done?'checked':'')+' onclick="event.stopPropagation()"><label>'+task+'</label></div>';
    });
    col.innerHTML=html; grid.appendChild(col);
  }
  updatePlanProgress(week,todayDay);
}
function updatePlanProgress(week,todayDay){
  const tTasks=getDayTasks(week,todayDay); let tDone=0;
  tTasks.forEach((_,i)=>{ if(state['plan_'+week+'-'+todayDay+'-'+i]==='1') tDone++; });
  const roll=state.roll||[]; let rDone=0; roll.forEach(r=>{ if(r.done) rDone++; });
  const total=tTasks.length+roll.length;
  const tRate=total?Math.round((tDone+rDone)/total*100):0;
  const tb=document.getElementById('homeTodayBar'); if(tb){ tb.style.width=tRate+'%'; tb.textContent=tRate+'%'; }
  const st=document.getElementById('homeStatToday'); if(st)st.textContent=(tDone+rDone)+'/'+(tTasks.length+roll.length);
  let wTotal=0,wDone=0; for(let d=0;d<7;d++){ const dt=getDayTasks(week,d); wTotal+=dt.length; dt.forEach((_,i)=>{ if(state['plan_'+week+'-'+d+'-'+i]==='1') wDone++; }); }
  const wRate=Math.round(wDone/wTotal*100); const sw=document.getElementById('homeStatWeek'); if(sw)sw.textContent=wRate+'%';
  let allTotal=0,allDone=0; for(let wk=0;wk<16;wk++){ for(let d=0;d<7;d++){ const dt=getDayTasks(wk,d); allTotal+=dt.length; dt.forEach((_,i)=>{ if(state['plan_'+wk+'-'+d+'-'+i]==='1') allDone++; }); } }
  const aRate=Math.round(allDone/allTotal*100); const sa=document.getElementById('homeStatTotal'); if(sa)sa.textContent=aRate+'%';
  const fb=document.getElementById('homeFeedBtn'); if(fb) fb.disabled = tRate<80;
}
function toggleHomeWeek(){
  const p=document.getElementById('homeWeekPanel'); const t=document.querySelector('.week-toggle');
  if(p.style.display==='none'){ p.style.display='block'; t.innerHTML='📆 收起本周计划 ▴'; }
  else { p.style.display='none'; t.innerHTML='📆 查看本周计划 ▾'; }
}
/* 弱点补给站 */
let weakIdx=0;
function renderHomeWeak(){
  const cats=Object.keys(WEAK_KNOWLEDGE);
  const cat=cats[weakIdx%cats.length];
  const items=WEAK_KNOWLEDGE[cat];
  const item=items[Math.floor(weakIdx/4)%items.length];
  const el=document.getElementById('homeWeakCard');
  if(el)el.innerHTML='<span class="weak-tag">'+cat+'</span><div class="weak-title">📖 '+item.t+'</div><div class="weak-body">'+item.b+'</div>';
}
function refreshWeak(){ weakIdx++; renderHomeWeak(); toast('已切换弱点补给 📖'); }

tick(); setInterval(tick,1000);
